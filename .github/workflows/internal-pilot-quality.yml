name: Internal Pilot Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Also run the Streamlit health smoke test."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: internal-pilot-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and Deployment Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run deployment preflight
        run: python scripts/preflight_internal_pilot_deploy.py --json

      - name: Run tests
        run: python -m pytest -q

      - name: Optional Streamlit smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
        run: python scripts/smoke_streamlit_app.py --timeout-seconds 80
